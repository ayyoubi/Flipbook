<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Usul elfiqh - Interactive Flipbook</title>

    <!-- Discord Preview -->
    <meta property="og:title" content="Usul elfiqh - Interactive Flipbook">
    <meta property="og:description" content="Click to read and flip through the pages directly in your browser.">
    <meta property="og:url" content="https://ayyoubi.github.io/Flipbook/">
    <meta property="og:image" content="https://ayyoubi.github.io/Flipbook/cover.jpg">

    <script src="pdf.min.js"></script>
    <script src="page-flip.browser.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #2f3136;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            color: white;
        }

        #book {
            box-shadow: 0 0 25px rgba(0,0,0,0.6);
            display: none;
            direction: ltr;
        }

        #loading {
            font-size: 1.2rem;
            text-align: center;
            padding: 20px;
        }

        .page {
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .page canvas {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
    </style>
</head>

<body>

    <div id="loading">Preparing your book...</div>
    <div id="book"></div>

    <script>

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        const url = 'usul_elfiqh.pdf';

        const loadingDiv = document.getElementById('loading');
        const bookContainer = document.getElementById('book');

        pdfjsLib.getDocument(url).promise.then(async pdf => {

            let rawPages = [];

            // Render PDF pages
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {

                loadingDiv.innerText =
                    `Loading page ${pageNum} of ${pdf.numPages}...`;

                const page = await pdf.getPage(pageNum);

                const viewport = page.getViewport({ scale: 1.1 });

                const canvas = document.createElement('canvas');

                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const context = canvas.getContext('2d');

                await page.render({
                    canvasContext: context,
                    viewport: viewport
                }).promise;

                const div = document.createElement('div');

                div.className = 'page';
                div.appendChild(canvas);

                rawPages.push(div);
            }

            // ==================================
            // ARABIC RTL PAGE ARRANGEMENT
            // ==================================

            // First PDF page = Front cover
            let pageDivs = [rawPages[0]];

            let interiorPages = rawPages.slice(1);

            // Add blank page if necessary
            if (interiorPages.length % 2 !== 0) {

                const blankDiv = document.createElement('div');

                blankDiv.className = 'page';

                interiorPages.push(blankDiv);
            }

            // Arrange interior pages
            for (let i = 0; i < interiorPages.length; i += 2) {

                let rightPage = interiorPages[i];
                let leftPage = interiorPages[i + 1];

                pageDivs.push(leftPage);
                pageDivs.push(rightPage);
            }

            // ==================================
            // INITIALIZE PAGE FLIP
            // ==================================

            loadingDiv.style.display = 'none';

            bookContainer.style.display = 'block';

            const isMobile = window.innerWidth < 768;

            const pageFlip = new St.PageFlip(bookContainer, {

                // Stretch responsively so the book fits narrow phone screens.
                width: 420,
                height: 594,

                size: "stretch",

                minWidth: 150,
                maxWidth: 420,

                minHeight: 212,
                maxHeight: 594,

                autoSize: true,

                maxShadowOpacity: 0.4,

                showCover: true,

                usePortrait: isMobile,

                mobileScrollSupport: true,

                flippingTime: 1000,

                useMouseEvents: true,

                disableFlipByClick: false

            });

            // Load pages
            pageFlip.loadFromHTML(pageDivs);

            // ==================================
            // NAVIGATION
            // ==================================

            // Arabic reading order:
            // The cover is the first (right-hand) page.
            // Dragging from the right edge toward the left advances the book.

            pageFlip.on('flip', (e) => {
                console.log('Current page:', e.data);
            });

        }).catch(err => {

            loadingDiv.style.color = '#ff6b6b';

            loadingDiv.innerText =
                "Error loading book: " + err.message;

            console.error(err);

        });

    </script>

</body>
</html>
