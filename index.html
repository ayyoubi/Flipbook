<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usul elfiqh - Arabic Flipbook</title>
    
    <!-- Open Graph Meta Tags for Discord Link Previews -->
    <meta property="og:title" content="Usul elfiqh - Arabic Flipbook">
    <meta property="og:description" content="Click to read and flip through the pages directly in your browser.">
    <meta property="og:url" content="https://ayyoubi.github.io/Flipbook/">
    <meta property="og:image" content="https://ayyoubi.github.io/Flipbook/cover.jpg">

    <script src="pdf.min.js"></script>
    <script src="page-flip.browser.js"></script>

    <style>
        body { 
            margin: 0; 
            background: #2f3136; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            color: white; 
        }
        #book { 
            width: 800px;
            height: 560px;
            box-shadow: 0 0 25px rgba(0,0,0,0.6); 
            display: none; 
            direction: rtl; /* Sets text and drag interaction flow to Right-to-Left */
        }
        #loading { 
            font-size: 1.2rem; 
            text-align: center; 
            padding: 20px; 
        }
        .page { 
            background-color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }
        .page canvas { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }
    </style>
</head>
<body>
    <div id="loading">Preparing Arabic book...</div>
    <div id="book"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        const url = 'usul_elfiqh.pdf';
        const loadingDiv = document.getElementById('loading');
        const bookContainer = document.getElementById('book');

        pdfjsLib.getDocument(url).promise.then(async pdf => {
            let pageDivs = [];
            
            // Render PDF pages in exact order (Page 1 = Cover, Page 2 = Inside Right, Page 3 = Inside Left, etc.)
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                loadingDiv.innerText = `Loading page ${pageNum} of ${pdf.numPages}...`;
                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.1 });

                const canvas = document.createElement('canvas');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                const context = canvas.getContext('2d');

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                const div = document.createElement('div');
                div.className = 'page';
                div.appendChild(canvas);
                pageDivs.push(div);
            }

            loadingDiv.style.display = 'none';
            bookContainer.style.display = 'block';

            const isMobile = window.innerWidth < 768;

            const pageFlip = new St.PageFlip(bookContainer, {
                width: 400,
                height: 560,
                size: "fixed",
                minWidth: 250,
                maxWidth: 700,
                minHeight: 350,
                maxHeight: 900,
                maxShadowOpacity: 0.4,
                showCover: true,
                usePortrait: isMobile,
                mobileScrollSupport: true,
                startPage: 0
            });

            pageFlip.loadFromHTML(pageDivs);

            // Reverses click-corner hotspots so clicking or dragging the top/bottom right corner lifts and flips the page to the left
            pageFlip.on('flip', (e) => {
                console.log('Flipped to page: ', e.data);
            });

        }).catch(err => {
            loadingDiv.style.color = '#ff6b6b';
            loadingDiv.innerText = "Error loading book: " + err.message;
            console.error(err);
        });
    </script>
</body>
</html>
