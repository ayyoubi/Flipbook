<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usul elfiqh - Interactive Flipbook</title>
    
    <!-- Open Graph Meta Tags for Discord Link Previews -->
    <meta property="og:title" content="Usul elfiqh - Interactive Flipbook">
    <meta property="og:description" content="Click to read and flip through the pages directly in your browser.">
    <meta property="og:url" content="https://ayyoubi.github.io/Flipbook/">
    <meta property="og:image" content="https://ayyoubi.github.io/Flipbook/cover.jpg">

    <script src="pdf.min.js"></script>
    <script src="page-flip.browser.js"></script>

    <style>
        body { 
            margin: 0; 
            background: #2f3136; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            color: white; 
        }
        #book { 
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.85); 
            display: none; 
        }
        #loading { 
            font-size: 1.2rem; 
            text-align: center; 
            padding: 20px; 
        }
        .page { 
            background-color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }
        .page canvas { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }

        /* Sleek custom audio button container */
        .audio-container {
            position: absolute;
            display: flex;
            flex-direction: column;
            gap: 5px;
            background: rgba(255, 255, 255, 0.96);
            padding: 6px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 10;
            pointer-events: auto;
        }
        .audio-btn {
            background: #2f3136;
            color: white;
            border: none;
            padding: 5px 12px;
            font-size: 11px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            width: 135px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        .audio-btn:hover {
            background: #4f545c;
        }

        /* Center Crease Shadow - DESKTOP ONLY */
        @media (min-width: 768px) {
            #book::after {
                content: "";
                position: absolute;
                top: 0;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 30px;
                background: linear-gradient(to right, rgba(0,0,0,0.05), rgba(0,0,0,0.22) 50%, rgba(0,0,0,0.05));
                pointer-events: none;
                z-index: 999;
                opacity: 1;
                transition: opacity 0.15s ease-in-out;
            }
            #book.is-flipping::after {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="loading">Preparing your book...</div>
    <div id="book"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        const url = 'usul_elfiqh.pdf';
        const loadingDiv = document.getElementById('loading');
        const bookContainer = document.getElementById('book');

        // Path calculation for GitHub Pages root/subfolder deployment
        const basePath = window.location.href.substring(0, window.location.href.lastIndexOf('/') + 1);

        pdfjsLib.getDocument(url).promise.then(async pdf => {
            let pageDivs = [];
            
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                loadingDiv.innerText = `Loading page ${pageNum} of ${pdf.numPages}...`;
                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.1 });

                const canvas = document.createElement('canvas');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                const context = canvas.getContext('2d');

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                const div = document.createElement('div');
                div.className = 'page';
                div.appendChild(canvas);

                // Prevents pageFlip library from stealing button clicks
                const attachAudioInterceptionFix = (container) => {
                    ['pointerdown', 'mousedown', 'click', 'touchstart', 'touchend'].forEach(evt => {
                        container.addEventListener(evt, (e) => e.stopPropagation());
                    });
                };

                // --- PAGE 5: 4 audio buttons at the bottom ---
                if (pageNum === 5) {
                    const box = document.createElement('div');
                    box.className = 'audio-container';
                    box.style.bottom = '15px';
                    box.style.left = '20px';

                    const tracks = [
                        { label: 'Moan Audio', file: 'moan.mp3' },
                        { label: 'Annoying Audio', file: 'annoying.mp3' },
                        { label: '5ali Audio', file: '5ali.mp3' },
                        { label: 'Gamed Audio', file: 'gamed.mp3' }
                    ];

                    tracks.forEach(track => {
                        const audioObj = new Audio(basePath + track.file);
                        audioObj.preload = 'auto';

                        const btn = document.createElement('button');
                        btn.className = 'audio-btn';
                        btn.innerHTML = `<span>▶ ${track.label}</span>`;
                        
                        btn.onclick = () => {
                            if (audioObj.paused) {
                                audioObj.load();
                                audioObj.play().then(() => {
                                    btn.innerHTML = `<span>⏸ ${track.label}</span>`;
                                }).catch(err => {
                                    console.error("Audio playback error:", err);
                                });
                            } else {
                                audioObj.pause();
                                btn.innerHTML = `<span>▶ ${track.label}</span>`;
                            }
                        };

                        audioObj.onended = () => {
                            btn.innerHTML = `<span>▶ ${track.label}</span>`;
                        };

                        box.appendChild(btn);
                    });

                    attachAudioInterceptionFix(box);
                    div.appendChild(box);
                }

                // --- PAGE 7: Pinned to the TOP of the page ---
                if (pageNum === 7) {
                    const box = document.createElement('div');
                    box.className = 'audio-container';
                    box.style.top = '15px'; // Positioned at top margin
                    box.style.left = '20px';

                    const audioObj = new Audio(basePath + 'gamed.mp3');
                    audioObj.preload = 'auto';

                    const btn = document.createElement('button');
                    btn.className = 'audio-btn';
                    btn.innerHTML = `<span>▶ Play Gamed</span>`;
                    
                    btn.onclick = () => {
                        if (audioObj.paused) {
                            audioObj.load();
                            audioObj.play().then(() => {
                                btn.innerHTML = `<span>⏸ Pause Gamed</span>`;
                            }).catch(err => {
                                console.error("Audio playback error:", err);
                            });
                        } else {
                            audioObj.pause();
                            btn.innerHTML = `<span>▶ Play Gamed</span>`;
                        }
                    };

                    audioObj.onended = () => {
                        btn.innerHTML = `<span>▶ Play Gamed</span>`;
                    };

                    box.appendChild(btn);
                    attachAudioInterceptionFix(box);
                    div.appendChild(box);
                }

                pageDivs.push(div);
            }

            loadingDiv.style.display = 'none';
            bookContainer.style.display = 'block';

            const isMobile = window.innerWidth < 768;

            const pageFlip = new St.PageFlip(bookContainer, {
                width: 420,
                height: 594,
                size: "fixed",
                minWidth: 250,
                maxWidth: 700,
                minHeight: 350,
                maxHeight: 900,
                maxShadowOpacity: 0.4,
                showCover: true,
                usePortrait: isMobile,
                mobileScrollSupport: true
            });

            pageFlip.loadFromHTML(pageDivs);

            pageFlip.on('changeState', (e) => {
                if (e.data === 'flipping' || e.data === 'user_fold') {
                    bookContainer.classList.add('is-flipping');
                } else if (e.data === 'read') {
                    bookContainer.classList.remove('is-flipping');
                }
            });

        }).catch(err => {
            loadingDiv.style.color = '#ff6b6b';
            loadingDiv.innerText = "Error loading book: " + err.message;
            console.error(err);
        });
    </script>
</body>
</html>
