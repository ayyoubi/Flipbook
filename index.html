<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usul elfiqh - Interactive Flipbook</title>
    
    <!-- Open Graph Meta Tags for Discord Link Previews -->
    <meta property="og:title" content="Usul elfiqh - Interactive Flipbook">
    <meta property="og:description" content="Click to read and flip through the pages directly in your browser.">
    <meta property="og:url" content="https://ayyoubi.github.io/Flipbook/">
    <meta property="og:image" content="https://ayyoubi.github.io/Flipbook/cover.jpg">

    <script src="pdf.min.js"></script>
    <script src="page-flip.browser.js"></script>

    <style>
        body { 
            margin: 0; 
            background: #2f3136; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            overflow: hidden; 
            font-family: Arial, sans-serif; 
            color: white; 
        }
        #book { 
            position: relative;
            box-shadow: 0 20px 50px rgba(0,0,0,0.85); 
            display: none; 
        }
        #loading { 
            font-size: 1.2rem; 
            text-align: center; 
            padding: 20px; 
        }
        .page { 
            background-color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            overflow: hidden; 
        }
        .page canvas { 
            max-width: 100%; 
            max-height: 100%; 
            object-fit: contain; 
        }

        /* Center Crease Shadow - DESKTOP ONLY */
        @media (min-width: 768px) {
            #book::after {
                content: "";
                position: absolute;
                top: 0;
                bottom: 0;
                left: 50%;
                transform: translateX(-50%);
                width: 30px;
                background: linear-gradient(to right, rgba(0,0,0,0.05), rgba(0,0,0,0.22) 50%, rgba(0,0,0,0.05));
                pointer-events: none;
                z-index: 999;
                opacity: 1;
                transition: opacity 0.15s ease-in-out;
            }
            #book.is-flipping::after {
                opacity: 0;
            }
        }
    </style>
</head>
<body>
    <div id="loading">Preparing your book...</div>
    <div id="book"></div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'pdf.worker.min.js';

        const url = 'usul_elfiqh.pdf';
        const loadingDiv = document.getElementById('loading');
        const bookContainer = document.getElementById('book');

        pdfjsLib.getDocument(url).promise.then(async pdf => {
            let pageDivs = [];
            
            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                loadingDiv.innerText = `Loading page ${pageNum} of ${pdf.numPages}...`;
                const page = await pdf.getPage(pageNum);
                const viewport = page.getViewport({ scale: 1.1 });

                const canvas = document.createElement('canvas');
                canvas.height = viewport.height;
                canvas.width = viewport.width;
                const context = canvas.getContext('2d');

                await page.render({ canvasContext: context, viewport: viewport }).promise;

                const div = document.createElement('div');
                div.className = 'page';
                div.appendChild(canvas);
                pageDivs.push(div);
            }

            loadingDiv.style.display = 'none';
            bookContainer.style.display = 'block';

            const isMobile = window.innerWidth < 768;

            const pageFlip = new St.PageFlip(bookContainer, {
                width: 420,
                height: 594,
                size: "fixed",
                minWidth: 250,
                maxWidth: 700,
                minHeight: 350,
                maxHeight: 900,
                maxShadowOpacity: 0.4,
                showCover: true,
                usePortrait: isMobile,
                mobileScrollSupport: true
            });

            pageFlip.loadFromHTML(pageDivs);

            // Listen for engine state changes to hide/show the crease during active desktop animations
            pageFlip.on('changeState', (e) => {
                if (e.data === 'flipping' || e.data === 'user_fold') {
                    bookContainer.classList.add('is-flipping');
                } else if (e.data === 'read') {
                    bookContainer.classList.remove('is-flipping');
                }
            });

        }).catch(err => {
            loadingDiv.style.color = '#ff6b6b';
            loadingDiv.innerText = "Error loading book: " + err.message;
            console.error(err);
        });
    </script>
</body>
</html>
