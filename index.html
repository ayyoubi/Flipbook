<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usul elfiqh - Flipbook</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/page-flip/dist/js/page-flip.browser.js"></script>
    <style>
        body { margin: 0; background: #2f3136; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #book { width: 90vw; height: 90vh; }
        .page { background-size: contain; background-repeat: no-repeat; background-position: center; background-color: white; }
    </style>
</head>
<body>
    <div id="book"></div>

    <script>
        // Points directly to your uploaded PDF filename (with URL encoding for spaces)
        const url = 'Usul%20elfiqh.pdf';

        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

        pdfjsLib.getDocument(url).promise.then(pdf => {
            const bookContainer = document.getElementById('book');
            const pageFlip = new St.PageFlip(bookContainer, {
                width: 550,
                height: 733,
                size: "stretch",
                minWidth: 315,
                maxWidth: 1000,
                minHeight: 420,
                maxHeight: 1350,
                maxShadowOpacity: 0.5,
                showCover: true,
                mobileScrollSupport: false
            });

            let renderPromises = [];

            for (let pageNum = 1; pageNum <= pdf.numPages; pageNum++) {
                renderPromises.push(
                    pdf.getPage(pageNum).then(page => {
                        const viewport = page.getViewport({ scale: 2 });
                        const canvas = document.createElement('canvas');
                        const context = canvas.getContext('2d');
                        canvas.height = viewport.height;
                        canvas.width = viewport.width;

                        return page.render({ canvasContext: context, viewport: viewport }).promise.then(() => {
                            const div = document.createElement('div');
                            div.className = 'page';
                            div.style.backgroundImage = `url(${canvas.toDataURL()})`;
                            return div;
                        });
                    })
                );
            }

            Promise.all(renderPromises).then(pageDivs => {
                pageFlip.loadFromHTML(pageDivs);
            });
        }).catch(err => {
            console.error("Error loading PDF:", err);
        });
    </script>
</body>
</html>
